<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Financial Goals - Personal Finance Manager</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #222;
        }

        .navbar {
            background: #1f2937;
            color: white;
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h2 {
            font-size: 22px;
        }

        .nav-links {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            padding: 9px 14px;
            border-radius: 6px;
        }

        .nav-links a:hover {
            background: #374151;
        }

        .logout {
            background: #ef4444 !important;
        }

        .logout:hover {
            background: #dc2626 !important;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 35px auto;
        }

        .top-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .top-section h1 {
            font-size: 30px;
        }

        .back-btn {
            text-decoration: none;
            background: #374151;
            color: white;
            padding: 10px 18px;
            border-radius: 7px;
        }

        .back-btn:hover {
            background: #111827;
        }

        .form-card {
            background: white;
            padding: 28px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            margin-bottom: 30px;
        }

        .form-card h2 {
            margin-bottom: 22px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            margin-bottom: 7px;
            font-weight: bold;
        }

        .form-group input {
            padding: 11px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 15px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #2563eb;
        }

        .add-btn {
            margin-top: 20px;
            background: #16a34a;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 7px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .add-btn:hover {
            background: #15803d;
        }

        .history-card {
            background: white;
            padding: 28px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .history-card h2 {
            margin-bottom: 20px;
        }

        .goal-card {
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 18px;
        }

        .goal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .goal-header h3 {
            font-size: 19px;
        }

        .deadline {
            color: #666;
            font-size: 14px;
        }

        .amounts {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            color: #555;
        }

        .progress-container {
            width: 100%;
            height: 14px;
            background: #e5e7eb;
            border-radius: 20px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: #16a34a;
            border-radius: 20px;
        }

        .no-data {
            text-align: center;
            color: #777;
            padding: 25px;
        }

        @media (max-width: 700px) {

            .navbar {
                padding: 15px 20px;
            }

            .nav-links {
                gap: 3px;
            }

            .nav-links a {
                padding: 7px 8px;
                font-size: 13px;
            }

            .container {
                width: 92%;
            }

            .top-section {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .goal-header {
                flex-direction: column;
                align-items: flex-start;
            }

        }

    </style>

</head>


<body>

<!-- NAVBAR -->

<div class="navbar">

    <h2>Personal Finance Manager</h2>

    <div class="nav-links">

        <a href="/dashboard">
            Dashboard
        </a>

        <a href="/expenses">
            Expenses
        </a>

        <a href="/budgets">
            Budgets
        </a>

        <a href="/logout" class="logout">
            Logout
        </a>

    </div>

</div>


<div class="container">

    <!-- PAGE TITLE -->

    <div class="top-section">

        <h1>🎯 Financial Goals</h1>

        <a href="/dashboard" class="back-btn">
            ← Dashboard
        </a>

    </div>


    <!-- ADD GOAL -->

    <div class="form-card">

        <h2>Create New Financial Goal</h2>

        <form action="/financial-goals/add" method="post">

            <div class="form-grid">

                <!-- DESCRIPTION -->

                <div class="form-group">

                    <label for="description">
                        Goal Description
                    </label>

                    <input
                            type="text"
                            id="description"
                            name="description"
                            placeholder="e.g. Buy a laptop"
                            required>

                </div>


                <!-- TARGET AMOUNT -->

                <div class="form-group">

                    <label for="targetAmount">
                        Target Amount (₹)
                    </label>

                    <input
                            type="number"
                            id="targetAmount"
                            name="targetAmount"
                            step="0.01"
                            min="0"
                            placeholder="Enter target amount"
                            required>

                </div>


                <!-- CURRENT AMOUNT -->

                <div class="form-group">

                    <label for="currentAmount">
                        Current Amount (₹)
                    </label>

                    <input
                            type="number"
                            id="currentAmount"
                            name="currentAmount"
                            step="0.01"
                            min="0"
                            value="0"
                            placeholder="Amount saved so far">

                </div>


                <!-- DEADLINE -->

                <div class="form-group">

                    <label for="deadline">
                        Deadline
                    </label>

                    <input
                            type="date"
                            id="deadline"
                            name="deadline"
                            required>

                </div>

            </div>


            <button type="submit" class="add-btn">
                + Create Goal
            </button>

        </form>

    </div>


    <!-- GOAL HISTORY -->

    <div class="history-card">

        <h2>Your Financial Goals</h2>


        <!-- GOALS -->

        <div th:each="goal : ${goals}" class="goal-card">

            <div class="goal-header">

                <h3 th:text="${goal.description}">
                    Buy a laptop
                </h3>

                <div class="deadline">

                    Deadline:

                    <span th:text="${goal.deadline}">
                        2026-12-31
                    </span>

                </div>

            </div>


            <div class="amounts">

                <span>

                    Saved:

                    ₹<span th:text="${goal.currentAmount}">
                        0
                    </span>

                </span>


                <span>

                    Target:

                    ₹<span th:text="${goal.targetAmount}">
                        0
                    </span>

                </span>

            </div>


            <!-- PROGRESS BAR -->

            <div class="progress-container">

                <div
                        class="progress-bar"
                        th:style="'width:' +
                        (${goal.targetAmount > 0 ?
                        (goal.currentAmount * 100 / goal.targetAmount) : 0}
                        > 100 ? 100 :
                        (${goal.targetAmount > 0 ?
                        (goal.currentAmount * 100 / goal.targetAmount) : 0}))
                        + '%;'">
                </div>

            </div>

        </div>


        <!-- NO GOALS -->

        <div
                th:if="${#lists.isEmpty(goals)}"
                class="no-data">

            No financial goals created yet.

        </div>

    </div>

</div>

</body>

</html>
