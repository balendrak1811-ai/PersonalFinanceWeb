<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Budgets - Personal Finance Manager</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #222;
        }

        .navbar {
            background: #1f2937;
            color: white;
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h2 {
            font-size: 22px;
        }

        .nav-links {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            padding: 9px 14px;
            border-radius: 6px;
        }

        .nav-links a:hover {
            background: #374151;
        }

        .logout {
            background: #ef4444 !important;
        }

        .logout:hover {
            background: #dc2626 !important;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 35px auto;
        }

        .top-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .top-section h1 {
            font-size: 30px;
        }

        .back-btn {
            text-decoration: none;
            background: #374151;
            color: white;
            padding: 10px 18px;
            border-radius: 7px;
        }

        .back-btn:hover {
            background: #111827;
        }

        .form-card {
            background: white;
            padding: 28px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            margin-bottom: 30px;
        }

        .form-card h2 {
            margin-bottom: 22px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            margin-bottom: 7px;
            font-weight: bold;
        }

        .form-group input,
        .form-group select {
            padding: 11px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 15px;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #2563eb;
        }

        .add-btn {
            margin-top: 20px;
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 7px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .add-btn:hover {
            background: #1d4ed8;
        }

        .history-card {
            background: white;
            padding: 28px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .history-card h2 {
            margin-bottom: 20px;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 13px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }

        th {
            background: #f3f4f6;
            font-weight: bold;
        }

        tr:hover {
            background: #f9fafb;
        }

        .no-data {
            text-align: center;
            color: #777;
            padding: 25px;
        }

        .budget-status {
            font-weight: bold;
        }

        .active {
            color: #16a34a;
        }

        .expired {
            color: #dc2626;
        }

        @media (max-width: 700px) {

            .navbar {
                padding: 15px 20px;
            }

            .nav-links {
                gap: 3px;
            }

            .nav-links a {
                padding: 7px 8px;
                font-size: 13px;
            }

            .container {
                width: 92%;
            }

            .top-section {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            th,
            td {
                font-size: 13px;
                padding: 10px;
            }
        }

    </style>

</head>


<body>

<!-- NAVBAR -->

<div class="navbar">

    <h2>Personal Finance Manager</h2>

    <div class="nav-links">

        <a href="/dashboard">
            Dashboard
        </a>

        <a href="/expenses">
            Expenses
        </a>

        <a href="/financial-goals">
            Goals
        </a>

        <a href="/logout" class="logout">
            Logout
        </a>

    </div>

</div>


<div class="container">

    <!-- PAGE TITLE -->

    <div class="top-section">

        <h1>💰 Budgets</h1>

        <a href="/dashboard" class="back-btn">
            ← Dashboard
        </a>

    </div>


    <!-- ADD BUDGET -->

    <div class="form-card">

        <h2>Create New Budget</h2>

        <form action="/budgets/add" method="post">

            <div class="form-grid">

                <!-- AMOUNT -->

                <div class="form-group">

                    <label for="amount">
                        Budget Amount (₹)
                    </label>

                    <input
                            type="number"
                            id="amount"
                            name="amount"
                            step="0.01"
                            min="0"
                            placeholder="Enter budget amount"
                            required>

                </div>


                <!-- CATEGORY -->

                <div class="form-group">

                    <label for="category">
                        Category
                    </label>

                    <select
                            id="category"
                            name="category"
                            required>

                        <option value="">
                            Select category
                        </option>

                        <option value="Food">
                            Food
                        </option>

                        <option value="Transport">
                            Transport
                        </option>

                        <option value="Shopping">
                            Shopping
                        </option>

                        <option value="Education">
                            Education
                        </option>

                        <option value="Entertainment">
                            Entertainment
                        </option>

                        <option value="Bills">
                            Bills
                        </option>

                        <option value="Health">
                            Health
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>


                <!-- START DATE -->

                <div class="form-group">

                    <label for="startDate">
                        Start Date
                    </label>

                    <input
                            type="date"
                            id="startDate"
                            name="startDate"
                            required>

                </div>


                <!-- END DATE -->

                <div class="form-group">

                    <label for="endDate">
                        End Date
                    </label>

                    <input
                            type="date"
                            id="endDate"
                            name="endDate"
                            required>

                </div>

            </div>


            <button type="submit" class="add-btn">
                + Create Budget
            </button>

        </form>

    </div>


    <!-- BUDGET HISTORY -->

    <div class="history-card">

        <h2>Budget History</h2>

        <div class="table-container">

            <table>

                <thead>

                <tr>

                    <th>ID</th>

                    <th>Category</th>

                    <th>Amount</th>

                    <th>Start Date</th>

                    <th>End Date</th>

                    <th>Status</th>

                </tr>

                </thead>


                <tbody>

                <tr th:each="budget : ${budgets}">

                    <td th:text="${budget.id}">
                        1
                    </td>

                    <td th:text="${budget.category}">
                        Food
                    </td>

                    <td>
                        ₹<span th:text="${budget.amount}">
                            0
                        </span>
                    </td>

                    <td th:text="${budget.startDate}">
                        2026-10-01
                    </td>

                    <td th:text="${budget.endDate}">
                        2026-10-31
                    </td>

                    <td>

                        <span
                                class="budget-status active"
                                th:if="${budget.endDate >= T(java.time.LocalDate).now()}">
                            Active
                        </span>

                        <span
                                class="budget-status expired"
                                th:if="${budget.endDate < T(java.time.LocalDate).now()}">
                            Expired
                        </span>

                    </td>

                </tr>


                <tr th:if="${#lists.isEmpty(budgets)}">

                    <td colspan="6" class="no-data">
                        No budgets created yet.
                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>

</html>
