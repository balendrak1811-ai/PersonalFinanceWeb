<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Expenses - Personal Finance Manager</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f7fb;
      color: #222;
    }

    .navbar {
      background: #1f2937;
      color: white;
      padding: 18px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .navbar h2 {
      font-size: 22px;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .nav-links a {
      color: white;
      text-decoration: none;
      padding: 9px 12px;
      border-radius: 6px;
    }

    .nav-links a:hover {
      background: #374151;
    }

    .logout {
      background: #dc2626;
    }

    .container {
      width: 90%;
      max-width: 1150px;
      margin: 35px auto;
    }

    .page-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }

    .page-heading h1 {
      font-size: 30px;
    }

    .back-btn {
      display: inline-block;
      padding: 10px 16px;
      color: white;
      background: #374151;
      text-decoration: none;
      border-radius: 6px;
    }

    .card {
      background: white;
      padding: 28px;
      margin-bottom: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.07);
    }

    .card h2 {
      margin-bottom: 22px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .form-group label {
      margin-bottom: 8px;
      font-weight: bold;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 15px;
    }

    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      border-color: #2563eb;
    }

    .add-btn {
      margin-top: 20px;
      padding: 12px 22px;
      border: none;
      border-radius: 6px;
      background: #2563eb;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .add-btn:hover {
      background: #1d4ed8;
    }

    .table-container {
      width: 100%;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 750px;
    }

    th,
    td {
      padding: 14px 12px;
      text-align: left;
      border-bottom: 1px solid #e5e7eb;
    }

    th {
      background: #f3f4f6;
      font-size: 14px;
    }

    td {
      font-size: 14px;
    }

    tbody tr:hover {
      background: #f9fafb;
    }

    .action-buttons {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .edit-btn {
      display: inline-block;
      padding: 8px 12px;
      background: #2563eb;
      color: white;
      text-decoration: none;
      border-radius: 5px;
    }

    .edit-btn:hover {
      background: #1d4ed8;
    }

    .delete-btn {
      padding: 8px 12px;
      background: #dc2626;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .delete-btn:hover {
      background: #b91c1c;
    }

    .no-data {
      text-align: center;
      padding: 25px;
      color: #777;
    }

    @media (max-width: 700px) {
      .navbar {
        padding: 16px 20px;
      }

      .container {
        width: 92%;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .card {
        padding: 20px;
      }

      .page-heading h1 {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>

<!-- NAVIGATION BAR -->

<div class="navbar">

  <h2>Personal Finance Manager</h2>

  <div class="nav-links">
    <a href="/dashboard">Dashboard</a>
    <a href="/budgets">Budgets</a>
    <a href="/financial-goals">Financial Goals</a>
    <a href="/logout" class="logout">Logout</a>
  </div>

</div>


<div class="container">

  <!-- PAGE HEADING -->

  <div class="page-heading">

    <h1>💸 Expense Management</h1>

    <a href="/dashboard" class="back-btn">
      ← Dashboard
    </a>

  </div>


  <!-- ADD EXPENSE FORM -->

  <div class="card">

    <h2>Add New Expense</h2>

    <form action="/expenses/add" method="post">

      <div class="form-grid">

        <div class="form-group">

          <label for="amount">Amount (₹)</label>

          <input
                  type="number"
                  id="amount"
                  name="amount"
                  min="0.01"
                  step="0.01"
                  placeholder="Enter amount"
                  required>

        </div>


        <div class="form-group">

          <label for="category">Category</label>

          <select id="category" name="category" required>

            <option value="">Select category</option>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Shopping">Shopping</option>
            <option value="Education">Education</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Bills">Bills</option>
            <option value="Health">Health</option>
            <option value="Other">Other</option>

          </select>

        </div>


        <div class="form-group">

          <label for="date">Date</label>

          <input
                  type="date"
                  id="date"
                  name="date"
                  required>

        </div>


        <div class="form-group">

          <label for="description">Description</label>

          <input
                  type="text"
                  id="description"
                  name="description"
                  maxlength="255"
                  placeholder="e.g. Lunch or books">

        </div>

      </div>

      <button type="submit" class="add-btn">
        + Add Expense
      </button>

    </form>

  </div>


  <!-- EXPENSE HISTORY -->

  <div class="card">

    <h2>Expense History</h2>

    <div class="table-container">

      <table>

        <thead>

        <tr>
          <th>ID</th>
          <th>Amount</th>
          <th>Category</th>
          <th>Date</th>
          <th>Description</th>
          <th>Actions</th>
        </tr>

        </thead>


        <tbody>

        <tr th:each="expense : ${expenses}">

          <td th:text="${expense.id}">1</td>

          <td>
            ₹<span th:text="${expense.amount}">0.00</span>
          </td>

          <td th:text="${expense.category}">Food</td>

          <td th:text="${expense.date}">2026-10-09</td>

          <td th:text="${expense.description}">Lunch</td>

          <td>

            <div class="action-buttons">

              <!-- EDIT BUTTON -->

              <a
                      th:href="@{/expenses/edit(id=${expense.id})}"
                      class="edit-btn">
                Edit
              </a>


              <!-- DELETE BUTTON -->

              <form
                      th:action="@{/expenses/delete}"
                      method="post"
                      onsubmit="return confirm('Are you sure you want to delete this expense?');">

                <input
                        type="hidden"
                        name="id"
                        th:value="${expense.id}">

                <button
                        type="submit"
                        class="delete-btn">
                  Delete
                </button>

              </form>

            </div>

          </td>

        </tr>


        <!-- EMPTY EXPENSE HISTORY -->

        <tr th:if="${#lists.isEmpty(expenses)}">

          <td colspan="6" class="no-data">
            No expenses added yet.
          </td>

        </tr>

        </tbody>

      </table>

    </div>

  </div>

</div>

</body>
</html>
